name: Update Resume Data

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  parse-resume:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pdfplumber

      - name: Parse resume and generate resumeData.js
        run: python scripts/parse_resume.py

      - name: Commit updated resumeData.js
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/assets/resumeData.js
          git diff --cached --quiet || git commit -m "chore: update resumeData.js from resume.pdf"
          git push
